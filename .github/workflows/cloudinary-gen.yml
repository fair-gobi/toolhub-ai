name: Generate Cloudinary FAST SIGNED

on:
  workflow_dispatch:
    inputs:
      batch_size:
        default: '500'
        description: 'Images per run'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install
        run: npm install @neondatabase/serverless ws cloudinary

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          node << 'NODE'
          const { neon } = require('@neondatabase/serverless');
          const cloudinary = require('cloudinary').v2;
          const sql = neon(process.env.DATABASE_URL);
          cloudinary.config({
            cloud_name: process.env.CLOUDINARY_CLOUD_NAME,
            api_key: process.env.CLOUDINARY_API_KEY,
            api_secret: process.env.CLOUDINARY_API_SECRET,
          });
          const BATCH = parseInt(process.env.BATCH_SIZE || '500');

          (async () => {
            const rows = await sql`SELECT id, prompt_content FROM prompts WHERE preview_url LIKE '%pollinations.ai%' LIMIT ${BATCH}`;
            console.log(`TO DO: ${rows.length}`);
            if(!rows.length){ console.log('ALL DONE'); return; }
            for(let i=0;i<rows.length;i++){
              const p = rows[i];
              const prompt = encodeURIComponent(p.prompt_content.slice(0,900));
              const seed = Math.floor(Math.random()*999999);
              const pollUrl = `https://image.pollinations.ai/prompt/${prompt}?model=turbo&width=1024&height=1024&seed=${seed}&nologo=true&enhance=true`;
              try{
                console.log(`[${i+1}/${rows.length}] ${p.id}`);
                // SIGNED remote fetch = Cloudinary downloads it server-to-server
                const res = await cloudinary.uploader.upload(pollUrl, {
                  folder: 'promptoolhub',
                  public_id: p.id,
                  overwrite: true,
                  resource_type: 'image'
                });
                await sql`UPDATE prompts SET preview_url=${res.secure_url} WHERE id=${p.id}`;
                console.log(` OK ${res.secure_url}`);
              }catch(e){
                console.error(` FAIL ${p.id} -> ${e.message?.slice(0,500)}`);
              }
            }
          })();
          NODE
