name: Generate Cloudinary Images

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Images per run (500 = ~30 min)'
        default: '500'
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install dotenv @neondatabase/serverless

      - name: Generate & Upload to Cloudinary
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          cat > gen.mjs << 'EOF'
          import { neon } from '@neondatabase/serverless'
          const sql = neon(process.env.DATABASE_URL)
          const CLOUD_NAME = process.env.CLOUDINARY_CLOUD_NAME
          const PRESET = process.env.CLOUDINARY_UPLOAD_PRESET
          const BATCH = parseInt(process.env.BATCH_SIZE || '1000')
          const DELAY = 3000

          async function fetchBuf(url){
            const r = await fetch(url, {signal: AbortSignal.timeout(20000)})
            if(!r.ok) throw new Error(`HTTP ${r.status}`)
            return Buffer.from(await r.arrayBuffer())
          }
          async function upload(buf, id){
            const blob = new Blob([buf], {type:'image/jpeg'})
            const f = new FormData()
            f.append('file', blob, `${id}.jpg`)
            f.append('upload_preset', PRESET)
            f.append('folder','promptoolhub')
            f.append('public_id', id)
            const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {method:'POST', body:f})
            const j = await r.json()
            if(!j.secure_url) throw new Error(JSON.stringify(j).slice(0,300))
            return j.secure_url
          }
          const rows = await sql`SELECT id, prompt_content FROM prompts WHERE preview_url LIKE '%pollinations.ai%' LIMIT ${BATCH}`
          console.log(`Found ${rows.length} to generate`)
          if(rows.length===0){ console.log('ALL DONE'); process.exit(0) }
          for(let i=0;i<rows.length;i++){
            const p = rows[i]
            const seed = Math.floor(Math.random()*9999999)
            const prompt = p.prompt_content.slice(0,600)
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&model=flux&width=1024&height=1024&nologo=true`
            try{
              console.log(`[${i+1}/${rows.length}] ${p.id}`)
              const buf = await fetchBuf(url)
              const cloud = await upload(buf, p.id)
              await sql`UPDATE prompts SET preview_url=${cloud} WHERE id=${p.id}`
              console.log(` OK ${cloud}`)
            }catch(e){ console.error(` FAIL ${p.id} ${e.message.slice(0,200)}`)}
            await new Promise(r=>setTimeout(r, DELAY))
          }
          console.log('Batch done')
          EOF
          BATCH_SIZE=${{ inputs.batch_size }} node gen.mjs
